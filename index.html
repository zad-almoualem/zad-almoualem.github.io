<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html,body{height:100%;margin:0} img{max-width:100%} [hidden]{display:none!important} :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>زاد المعلّم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&display=swap">
<style>
/* Layout: one centered column (max 1080px). Grades are drawn as Tunisian notebook covers (كرّاس) with Seyes-ruled labels; everything else is quiet list rows. */
:root{
  --paper:#f4f6fb; --surface:#ffffff; --sunk:#eef1f8;
  --ink:#18213b; --muted:#5a6482; --line:#dce1ee;
  --accent:#2443b0; --accent-ink:#ffffff; --accent-soft:#e6ebfb;
  --red:#c4302b; --red-soft:#fbe8e7;
  --ok:#1b7647; --ok-soft:#e2f3e9; --warn:#935d00; --warn-soft:#fbefd9;
  --rule:#cfdaf3; --margin:#e9a5a2;
  --g1:#c93c3c; --g2:#c06a0c; --g3:#23874c; --g4:#2471b3; --g5:#6447b8; --g6:#1d2c66;
  --cover-ink:#ffffff;
  --shadow:0 1px 2px rgb(24 33 59 / .06), 0 6px 18px rgb(24 33 59 / .07);
  --f-display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0f1320; --surface:#171c2b; --sunk:#1d2335;
  --ink:#e7eaf4; --muted:#9aa3bf; --line:#2a3148;
  --accent:#8ea6ff; --accent-ink:#0f1320; --accent-soft:#222c4d;
  --red:#ff8a84; --red-soft:#3a1f22; --ok:#6fd39c; --ok-soft:#173226; --warn:#f0b75a; --warn-soft:#352a14;
  --rule:#2c3552; --margin:#6b3a3c;
  --g1:#a83434; --g2:#9e5810; --g3:#1d7040; --g4:#1f5f97; --g5:#55399e; --g6:#2a3b80;
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 6px 18px rgb(0 0 0 / .25);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0f1320; --surface:#171c2b; --sunk:#1d2335;
  --ink:#e7eaf4; --muted:#9aa3bf; --line:#2a3148;
  --accent:#8ea6ff; --accent-ink:#0f1320; --accent-soft:#222c4d;
  --red:#ff8a84; --red-soft:#3a1f22; --ok:#6fd39c; --ok-soft:#173226; --warn:#f0b75a; --warn-soft:#352a14;
  --rule:#2c3552; --margin:#6b3a3c;
  --g1:#a83434; --g2:#9e5810; --g3:#1d7040; --g4:#1f5f97; --g5:#55399e; --g6:#2a3b80;
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 6px 18px rgb(0 0 0 / .25);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
#app{min-height:100%;display:flex;flex-direction:column}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.35;margin:0;text-wrap:balance}
p{margin:0}
.wrap{width:100%;max-width:1080px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* demo strip + header */
.demo{background:var(--warn-soft);color:var(--warn);font-size:13px}
.demo .wrap{padding-block:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);margin-inline-end:auto}
.brand b{font-family:var(--f-display);font-size:21px;font-weight:700}
.brand .mark{width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.nav{display:flex;align-items:center;gap:4px}
.nav a.lnk{color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:8px;font-weight:500}
.nav a.lnk:hover{background:var(--sunk);color:var(--ink)}
@media (max-width:620px){ .nav a.lnk.opt{display:none} }

/* buttons */
.btn{appearance:none;border:1px solid transparent;border-radius:9px;padding:9px 16px;font:600 14.5px/1.4 var(--f-body);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{background:var(--sunk)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn.ok{background:var(--ok-soft);color:var(--ok)}
.btn.sm{padding:6px 12px;font-size:13.5px}
.btn.block{width:100%}
.btn[disabled]{opacity:.55;cursor:progress}

/* hero */
.hero{padding-block:36px 24px;display:grid;gap:16px}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--accent)}
.hero h1{font-size:clamp(28px,5.4vw,44px);max-width:20ch}
.hero p.lead{font-size:17px;color:var(--muted);max-width:56ch}
.hero .ctas{display:flex;gap:10px;flex-wrap:wrap}
.kinds{display:flex;flex-wrap:wrap;gap:8px}
.kind-tag{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:500;padding:5px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.kind-tag svg{width:16px;height:16px;color:var(--accent)}

section.block{padding-block:28px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.sec-head h2{font-size:24px}

/* notebook covers */
.covers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:760px){ .covers{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px} }
.cover{--gc:var(--g1);position:relative;display:flex;flex-direction:column;gap:14px;min-height:178px;padding:14px 14px 14px 14px;padding-inline-start:24px;border-radius:6px 14px 14px 6px;background:var(--gc);color:var(--cover-ink);text-decoration:none;box-shadow:var(--shadow);overflow:hidden;transition:transform .18s ease}
[dir="rtl"] .cover{border-radius:14px 6px 6px 14px}
.cover::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:12px;background:rgb(0 0 0 / .2)}
.cover::after{content:"";position:absolute;inset-block:0;inset-inline-start:12px;width:1px;background:rgb(255 255 255 / .25)}
.cover:hover{transform:translateY(-3px)}
.cover .gnum{font-family:var(--f-display);font-size:46px;line-height:1;font-weight:700;opacity:.95}
.cover .lbl{margin-top:auto;background:var(--surface);color:var(--ink);border-radius:6px;padding:8px 10px;
  background-image:linear-gradient(to left, transparent 18px, var(--margin) 18px, var(--margin) 19px, transparent 19px),repeating-linear-gradient(to bottom, transparent 0 9px, var(--rule) 9px 10px)}
.cover .lbl b{display:block;font-family:var(--f-display);font-size:17px;font-weight:700;line-height:1.5}
.cover .lbl span{font-size:12.5px;color:var(--muted)}
.cover .own{position:absolute;top:12px;inset-inline-end:12px;font-size:12px;font-weight:600;background:rgb(255 255 255 / .2);padding:2px 9px;border-radius:999px}
@media (prefers-reduced-motion:reduce){ .cover{transition:none} .cover:hover{transform:none} }

/* steps + pricing */
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;counter-reset:st}
@media (max-width:760px){ .steps{grid-template-columns:1fr} }
.step{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.step .n{flex:none;width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--f-display);font-weight:700}
.step b{display:block}
.plans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:620px){ .plans{grid-template-columns:1fr} }
.plan{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px}
.plan.feat{border:2px solid var(--accent);box-shadow:var(--shadow)}
.plan .price{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1.1}
.plan .price small{font-family:var(--f-body);font-size:14px;font-weight:500;color:var(--muted)}
.plan ul{margin:0;padding-inline-start:18px;display:grid;gap:4px}
.badge{display:inline-block;align-self:flex-start;font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--accent);color:var(--accent-ink)}

/* page heads + lists */
.crumbs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13.5px;color:var(--muted);padding-top:18px}
.crumbs a{color:var(--muted);text-decoration:none}
.crumbs a:hover{color:var(--accent)}
.phead{display:flex;align-items:center;gap:14px;padding-block:12px 18px;flex-wrap:wrap}
.phead .chip-g{width:52px;height:52px;border-radius:10px;background:var(--gc);color:var(--cover-ink);display:grid;place-items:center;font-family:var(--f-display);font-size:26px;font-weight:700;flex:none}
.phead .t{min-width:0;flex:1}
.phead h1{font-size:clamp(22px,4vw,30px)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--line);text-decoration:none;color:var(--ink);min-width:0}
.row:first-child{border-top:0}
a.row:hover{background:var(--sunk)}
.row .main{flex:1;min-width:0}
.row .ttl{font-weight:600;overflow-wrap:anywhere}
.row .meta{font-size:13px;color:var(--muted);display:flex;gap:6px 10px;flex-wrap:wrap;align-items:center}
.row .ico{width:40px;height:40px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.row .chev{color:var(--muted)}
.counts{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.cnt{font-size:12px;padding:1px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.cnt b{color:var(--ink);font-weight:600}
.soon{font-size:12.5px;color:var(--muted)}

.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:thin}
.tab{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 14px;font:500 14px/1.4 var(--f-body);cursor:pointer;white-space:nowrap}
.tab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}

.notice{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-radius:12px;margin-bottom:14px;background:var(--accent-soft);color:var(--ink)}
.notice.warn{background:var(--warn-soft)}
.notice.ok{background:var(--ok-soft)}
.notice .grow{flex:1;min-width:200px}

.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:1px 9px;border-radius:999px;white-space:nowrap}
.pill.pending{background:var(--warn-soft);color:var(--warn)}
.pill.active{background:var(--ok-soft);color:var(--ok)}
.pill.rejected,.pill.expired{background:var(--red-soft);color:var(--red)}
.pill.free{background:var(--ok-soft);color:var(--ok)}

/* forms */
.narrow{max-width:460px;margin-inline:auto;padding-block:32px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:16px}
.card h1{font-size:24px}
form.f{display:grid;gap:14px}
.field{display:grid;gap:5px}
.field label{font-weight:600;font-size:14px}
.field .hint{font-size:12.5px;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[type="email"],input[type="tel"],input.ltr{direction:ltr;text-align:right}
input[type="checkbox"],input[type="radio"]{width:auto;accent-color:var(--accent)}
.err{display:none;padding:10px 12px;border-radius:9px;background:var(--red-soft);color:var(--red);font-size:14px}
.err.on{display:block}
.alt{text-align:center;font-size:14px;color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){ .two{grid-template-columns:1fr} }
.choice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:11px;cursor:pointer;background:var(--surface)}
.choice:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.choice input{margin-top:5px}
.choice b{display:block}
.payto{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border-radius:11px;background:var(--sunk)}
.payto code{font:600 18px/1.3 ui-monospace,Menlo,Consolas,monospace;direction:ltr;user-select:all;letter-spacing:.04em}
.demo-btns{display:grid;gap:8px;padding-top:4px;border-top:1px dashed var(--line)}

/* account + admin */
.page{padding-block:8px 40px;display:grid;gap:18px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:14.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.admin-tabs{display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--line)}
.atab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;font:600 14.5px/1.4 var(--f-body);color:var(--muted);cursor:pointer;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.atab[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.atab .c{font-size:11.5px;background:var(--red);color:#fff;border-radius:999px;padding:0 7px}
.req{display:grid;gap:10px;padding:14px 16px;border-top:1px solid var(--line)}
.req:first-child{border-top:0}
.req .top{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center}
.req .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.req .acts .field{min-width:150px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

footer.foot{margin-top:auto;border-top:1px solid var(--line);background:var(--surface)}
footer.foot .wrap{padding-block:18px;display:flex;gap:8px 20px;flex-wrap:wrap;justify-content:space-between;font-size:13.5px;color:var(--muted)}
footer.foot .sel{user-select:all;direction:ltr;unicode-bidi:isolate}

.toast{position:fixed;inset-inline:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:50;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.toast div{background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;box-shadow:var(--shadow);font-size:14.5px;max-width:520px;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s}
.toast div.on{opacity:1;transform:none}
.loading{padding:48px 0;text-align:center;color:var(--muted)}
/* v2: domains + trimesters */
.subjline{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.owned{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.tab .lk{display:inline-flex;vertical-align:-3px;margin-inline-start:4px}
.tab .lk svg{width:14px;height:14px}
.kinds-f{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.kf{appearance:none;border:0;background:var(--sunk);color:var(--muted);border-radius:8px;padding:4px 10px;font:500 13px/1.5 var(--f-body);cursor:pointer}
.kf[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.group-h{padding:9px 16px;background:var(--sunk);font-weight:600;font-size:13.5px;color:var(--muted);border-top:1px solid var(--line)}
.group-h:first-child{border-top:0}
.checks{display:grid;gap:8px}
.checks.cols{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:520px){ .checks.cols{grid-template-columns:1fr} }
.total{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;padding:14px 16px;border-radius:11px;background:var(--accent-soft)}
.total b{font-family:var(--f-display);font-size:26px;line-height:1.2}
.total span{font-size:13.5px;color:var(--muted)}
.price-hero{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.price-hero .price{font-family:var(--f-display);font-size:40px;font-weight:700;line-height:1.1}
.ex{display:grid;gap:0;border:1px solid var(--line);border-radius:11px;overflow:hidden}
.ex div{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border-top:1px solid var(--line)}
.ex div:first-child{border-top:0}
.ex b{white-space:nowrap}
.dom-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.dom-chip{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:12px 14px;min-width:0}
.dom-chip b{display:block;font-family:var(--f-display);font-size:16px}
.dom-card{display:grid;gap:10px;padding:16px}
.dom-card .hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dom-card h3{font-size:18px}
form.f.inline-f{display:flex;gap:8px;align-items:flex-end}
.inline-f .field{flex:1;min-width:0}
.tabs.wrapt{flex-wrap:wrap;overflow:visible}
</style>
</head>

function arError(e){
  const m = String(e && (e.message || e.error_description || e) || "");
  if (/Invalid login credentials/i.test(m)) return "البريد الإلكتروني أو كلمة السرّ غير صحيحة.";
  if (/already registered|already exists/i.test(m)) return "هذا البريد مسجّل من قبل. سجّل الدخول أو استرجع كلمة السرّ.";
  if (/Email not confirmed/i.test(m)) return "لم يتمّ تأكيد البريد بعد. افتح الرسالة التي وصلتك واضغط على رابط التأكيد.";
  if (/at least 6/i.test(m)) return "كلمة السرّ يجب أن تكون 6 أحرف على الأقل.";
  if (/rate limit|too many/i.test(m)) return "محاولات كثيرة. انتظر دقيقة ثم أعد المحاولة.";
  if (/domain does not belong/i.test(m)) return "أحد المجالات المختارة لا يخصّ هذا القسم. أعد اختيار المجالات.";
  if (/duplicate key|unique/i.test(m)) return "هذا الاسم موجود من قبل.";
  if (/not found|row-level|permission|policy/i.test(m)) return "ليس لديك صلاحية لهذه العملية. تحقّق من اشتراكك أو أعد تسجيل الدخول.";
  if (/does not exist|relation|schema cache/i.test(m)) return "قاعدة البيانات تحتاج إلى التحديث. شغّل ملف التحديث في Supabase.";
  if (/Failed to fetch|NetworkError/i.test(m)) return "تعذّر الاتصال بالخادم. تحقّق من الإنترنت ثم أعد المحاولة.";
  return "حدث خطأ: " + m;
}

function supabaseApi(){
  const sb = window.supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY);
  const here = location.origin + location.pathname;
  const ok = r => { if (r.error) throw r.error; return r.data; };
  return {
    demo: false,
    async session(){ return ok(await sb.auth.getSession()).session; },
    onAuth(cb){ sb.auth.onAuthStateChange((ev, s) => setTimeout(() => cb(ev, s), 0)); },
    async signUp({ email, password, full_name, phone }){
      return ok(await sb.auth.signUp({ email, password, options: { data: { full_name, phone }, emailRedirectTo: here } }));
    },
    async signIn(email, password){ return ok(await sb.auth.signInWithPassword({ email, password })).session; },
    async signOut(){ await sb.auth.signOut(); },
    async resetPassword(email){ ok(await sb.auth.resetPasswordForEmail(email, { redirectTo: here })); },
    async updatePassword(password){ ok(await sb.auth.updateUser({ password })); },
    async profile(id){ return ok(await sb.from("profiles").select("*").eq("id", id).maybeSingle()); },
    async domains(){ return ok(await sb.from("domains").select("*").order("grade").order("sort").order("id")); },
    async subjects(){ return ok(await sb.from("subjects").select("*").order("sort").order("id")); },
    async counts(){ return ok(await sb.from("domain_counts").select("*")); },
    async resources(subjectIds){
      if (!subjectIds.length) return [];
      return ok(await sb.from("resources").select("*").in("subject_id", subjectIds).order("created_at", { ascending: false }));
    },
    async downloadUrl(r){ return ok(await sb.storage.from("resources").createSignedUrl(r.file_path, 300, { download: r.file_name || true })).signedUrl; },
    async mySubs(uid){ return ok(await sb.from("subscriptions").select("*").eq("user_id", uid).order("created_at", { ascending: false })); },
    async requestSub(row){ ok(await sb.from("subscriptions").insert(row)); },
    async allSubs(){ return ok(await sb.from("subscriptions").select("*, profiles(full_name,email,phone)").order("created_at", { ascending: false })); },
    async setSub(id, patch){ ok(await sb.from("subscriptions").update(patch).eq("id", id)); },
    async upload({ grade, subject_id, kind, trimester, title, file, is_free }){
      const ext = ((file.name.split(".").pop() || "bin").toLowerCase().replace(/[^a-z0-9]/g, "")) || "bin";
      const path = `${grade}/${subject_id}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
      ok(await sb.storage.from("resources").upload(path, file, { contentType: file.type || undefined }));
      const r = await sb.from("resources").insert({ subject_id, kind, trimester, title, file_path: path, file_name: file.name, is_free });
      if (r.error){ await sb.storage.from("resources").remove([path]); throw r.error; }
    },
    async deleteResource(r){ ok(await sb.from("resources").delete().eq("id", r.id)); await sb.storage.from("resources").remove([r.file_path]); },
    async addDomain(row){ ok(await sb.from("domains").insert(row)); },
    async deleteDomain(id){ ok(await sb.from("domains").delete().eq("id", id)); },
    async addSubject(row){ ok(await sb.from("subjects").insert(row)); },
    async deleteSubject(id){ ok(await sb.from("subjects").delete().eq("id", id)); },
    async profiles(){ return ok(await sb.from("profiles").select("*").order("created_at", { ascending: false })); }
  };
}

function parseHash(){
  const h = decodeURIComponent((location.hash || "").slice(1));
  const m = h.match(/^(grade|domain)-(\d+)$/);
  if (m) return { route: m[1], param: +m[2] };
  if (h === "grades" || h === "pricing") return { route: "home", param: h };
  return { route: ROUTES.includes(h) ? h : "home", param: null };
}
function go(h){ if (location.hash === "#" + h){ Object.assign(S, parseHash()); render(); } else location.hash = h; }
window.addEventListener("hashchange", () => {
  const prev = S.route + S.param; Object.assign(S, parseHash());
  if (S.route === "domain" && prev !== S.route + S.param){ S.trimTab = null; S.kindTab = "all"; }

function subjLine(did){
  const d = domainById(did), ss = subjectsOf(did);
  if (ss.length === 1 && d && ss[0].name === d.name) return "";

function ownedTrims(g, did){
  if (isAdmin()) return [1, 2, 3];
  const set = new Set();
  activeSubs().forEach(s => { if (s.grade === g && (s.domain_ids || []).map(Number).includes(did)) (s.trimesters || []).forEach(t => set.add(+t)); });
  return [...set].sort();
}

async function vDomain(id){
  const d = domainById(id);
  if (!d) return `<div class="wrap"><div class="empty">هذا المجال غير موجود.</div></div>`;
  S.lastGrade = d.grade;
  const subs = subjectsOf(id);
  const key = "d" + id;
  if (!S.res[key]) S.res[key] = await api.resources(subs.map(s => s.id));
  const all = S.res[key];
  const hasAnnual = all.some(r => r.trimester == null);
  let t = S.trimTab;
  if (t == null) t = currentTrim();
  if (t === 0 && !hasAnnual) t = currentTrim();
  S.trimTab = t;
  const tval = t === 0 ? null : t;
  const inTab = all.filter(r => (r.trimester == null ? 0 : r.trimester) === t);
  const list = S.kindTab === "all" ? inTab : inTab.filter(r => r.kind === S.kindTab);
  const access = S.session && hasAccess(d.grade, id, tval);
  const tabIds = [1, 2, 3].concat(hasAnnual ? [0] : []);
  const tabs = tabIds.map(x => {
    const n = all.filter(r => (r.trimester == null ? 0 : r.trimester) === x).length;
    const lk = !(S.session && hasAccess(d.grade, id, x === 0 ? null : x));
    return `<button class="tab" data-act="trim" data-t="${x}" aria-pressed="${x === t}">${TRIM[x]} <span class="num">${n}</span>${lk ? `<span class="lk">${icon("lock")}</span>` : ""}</button>`;
  }).join("");
  const kinds = [`<button class="kf" data-act="kind" data-k="all" aria-pressed="${S.kindTab === "all"}">الكلّ</button>`]
    .concat(KINDS.filter(k => inTab.some(r => r.kind === k.id)).map(k => `<button class="kf" data-act="kind" data-k="${k.id}" aria-pressed="${S.kindTab === k.id}">${k.label}</button>`)).join("");
  let notice = "";
  const buyT = t === 0 ? currentTrim() : t;
  if (!S.session) notice = `<div class="notice">${icon("lock")}<span class="grow">سجّل الدخول لتحميل الملفّات. الملفّات المجانية متاحة لكلّ من لديه حساب.</span><a class="btn primary sm" href="#login" data-act="remember">تسجيل الدخول</a></div>`;
  else if (!access) notice = `<div class="notice warn">${icon("lock")}<span class="grow">${t === 0 ? `ملفّات «طوال السنة» متاحة لكلّ مشترك في ${esc(d.name)} لأيّ ثلاثي.` : `ملفّات ${esc(d.name)} في ${TRIM[t]} متاحة للمشتركين.`} الاشتراك: <b class="num">${money(C.PRICE)}</b>.</span><a class="btn primary sm" href="#subscribe" data-act="presub" data-g="${d.grade}" data-d="${id}" data-t="${buyT}">اشترك</a></div>`;
  const rowOf = r => {
    const can = S.session && (r.is_free || hasAccess(d.grade, id, r.trimester == null ? null : r.trimester));
    return `<div class="row">
      <span class="ico">${icon(KICON[r.kind])}</span>
      <div class="main"><div class="ttl">${esc(r.title)}</div>
        <div class="meta"><span>${KIND[r.kind].one}</span><span>·</span><span>${fmtDate(r.created_at)}</span>${r.is_free ? `<span class="pill free">مجاني</span>` : ""}</div></div>
      ${can ? `<button class="btn soft sm" data-act="download" data-id="${r.id}" data-k="${key}">${icon("down")}تحميل</button>`
            : `<button class="btn ghost sm" data-act="locked" data-g="${d.grade}" data-d="${id}" data-t="${buyT}" aria-label="مقفل">${icon("lock")}</button>`}
    </div>`;
  };
  const groups = subs.map(s => {
    const rs = list.filter(r => r.subject_id === s.id);
    return rs.length ? `<div class="group-h">${esc(s.name)}</div>${rs.map(rowOf).join("")}` : "";
  }).join("");
  return `<div class="wrap">
    <nav class="crumbs"><a href="#home">الرئيسية</a>›<a href="#grade-${d.grade}">${GRADE[d.grade]}</a>›<span>${esc(d.name)}</span></nav>
    <div class="phead" style="--gc:var(--g${d.grade})"><span class="chip-g">${d.grade}</span>
      <div class="t"><h1>${esc(d.name)}</h1><span class="subjline">${GRADE[d.grade]}${subjLine(id) ? " · " + esc(subjLine(id)) : ""}</span></div></div>
    <div class="tabs wrapt" role="group" aria-label="الثلاثي">${tabs}</div>
    ${notice}
    ${inTab.length ? `<div class="kinds-f" role="group" aria-label="نوع الملف">${kinds}</div>` : ""}
    <div class="list">${groups || `<div class="empty">لا توجد ملفّات في ${TRIM[t]} بعد.</div>`}</div>
    <div style="height:40px"></div>
  </div>`;
}

async function vAdmin(){
  if (!isAdmin()) return `<div class="wrap"><div class="empty">هذه الصفحة للمدير فقط.</div></div>`;
  if (!S.admSubs) S.admSubs = await api.allSubs();
  const a = S.adm;
  const pendingN = S.admSubs.filter(s => s.status === "pending").length;
  const tabs = [["requests", "الطلبات", pendingN], ["subs", "المشتركون"], ["users", "الحسابات"], ["files", "الملفّات"], ["domains", "المجالات"]]
    .map(([id, l, c]) => `<button class="atab" data-act="atab" data-t="${id}" aria-pressed="${a.tab === id}">${l}${c ? `<span class="c num">${c}</span>` : ""}</button>`).join("");
  let body = "";
  if (a.tab === "requests") body = admRequests(S.admSubs.filter(s => s.status === "pending"));
  else if (a.tab === "subs") body = admSubs(S.admSubs.filter(s => s.status !== "pending"));
  else if (a.tab === "users") body = await admUsers();
  else if (a.tab === "files") body = await admFiles();
  else body = admDomains();
  return `<div class="wrap page">
    <nav class="crumbs"><a href="#home">الرئيسية</a>›<span>لوحة التحكّم</span></nav>
    <h1 style="font-size:26px">لوحة التحكّم</h1>
    <div class="admin-tabs" role="group">${tabs}</div>
    ${body}
  </div>`;
}

    <div class="top">${who(s)}${subStatus(s)}</div>
    <div style="display:flex;gap:4px 12px;flex-wrap:wrap;font-size:14px"><b>${esc(subDesc(s))}</b>
      ${s.expires_at ? `<span class="muted">إلى ${fmtDate(s.expires_at)}</span>` : ""}<span class="muted num">${s.amount ? money(s.amount) : ""} · ${esc(s.payment_ref || "")}</span></div>
    <div class="acts">${s.status === "active" ? `<button class="btn danger sm" data-act="deactivate" data-id="${s.id}" data-confirm="تأكيد الإيقاف؟">إيقاف الاشتراك</button>`
      : `<button class="btn ok sm" data-act="reactivate" data-id="${s.id}">تفعيل إلى ${fmtDate(defaultExpiry())}</button>`}</div>
  </div>`).join("")}</div>`;
}
async function admUsers(){
  const users = await api.profiles();
  const subsOf = id => (S.admSubs || []).filter(s => s.user_id === id);
  const state = u => {
    if (u.is_admin) return `<span class="pill free">مدير</span>`;
    const ss = subsOf(u.id);
    if (ss.some(isActive)) return `<span class="pill active">مشترك</span>`;
    if (ss.some(s => s.status === "pending")) return `<span class="pill pending">طلب في الانتظار</span>`;
    return `<span class="pill expired">بلا اشتراك</span>`;
  };
  const rows = users.map(u => `<div class="req">
    <div class="top"><b>${esc(u.full_name || "—")}</b>${state(u)}</div>
    <div style="display:flex;gap:4px 14px;flex-wrap:wrap;font-size:14px">
      <span class="muted" style="direction:ltr;unicode-bidi:isolate;user-select:all">${esc(u.email || "")}</span>
      ${u.phone ? `<span class="muted" style="direction:ltr;unicode-bidi:isolate;user-select:all">${esc(u.phone)}</span>` : ""}
      <span class="muted">سجّل في ${fmtDate(u.created_at)}</span></div>
  </div>`).join("");
  return `<p class="muted small num">عدد الحسابات: ${users.length}</p><div class="list">${rows || `<div class="empty">لا توجد حسابات بعد.</div>`}</div>`;
}
async function admFiles(){
  const a = S.adm;
  const ds = domainsOf(a.grade);
  if (!ds.find(d => d.id === a.domain)) a.domain = ds[0] ? ds[0].id : null;
  const ss = a.domain ? subjectsOf(a.domain) : [];
  if (!ss.find(s => s.id === a.subject)) a.subject = ss[0] ? ss[0].id : null;
  let existing = "";
  if (a.subject){
    const key = "s" + a.subject;
    if (!S.res[key]) S.res[key] = await api.resources([a.subject]);
    const list = S.res[key];
    existing = list.length ? [1, 2, 3, 0].map(t => {
      const rs = list.filter(r => (r.trimester == null ? 0 : r.trimester) === t);
      return rs.length ? `<div class="group-h">${TRIM[t]}</div>` + rs.map(r => `<div class="row"><span class="ico">${icon(KICON[r.kind])}</span>
        <div class="main"><div class="ttl">${esc(r.title)}</div><div class="meta"><span>${KIND[r.kind].one}</span><span>·</span><span style="direction:ltr;unicode-bidi:isolate">${esc(r.file_name || "")}</span>${r.is_free ? `<span class="pill free">مجاني</span>` : ""}</div></div>
        <button class="btn danger sm" data-act="delres" data-id="${r.id}" data-k="${key}" data-confirm="تأكيد الحذف؟">حذف</button></div>`).join("") : "";
    }).join("") : `<div class="empty">لا توجد ملفّات في هذه المادة بعد.</div>`;
  }
  const subjName = (subjectById(a.subject) || {}).name || "";
  return `<div class="card">
    <h2 style="font-size:19px">إضافة ملف</h2>
    <form class="f" data-form="upload" novalidate>
      <div class="err" role="alert"></div>
      <div class="two">
        <div class="field"><label for="up-grade">القسم</label><select id="up-grade" name="grade" data-change="upgrade">${[1,2,3,4,5,6].map(g => `<option value="${g}" ${g === a.grade ? "selected" : ""}>${GRADE[g]}</option>`).join("")}</select></div>
        <div class="field"><label for="up-domain">المجال</label><select id="up-domain" name="domain" data-change="updomain">${ds.map(d => `<option value="${d.id}" ${d.id === a.domain ? "selected" : ""}>${esc(d.name)}</option>`).join("")}</select></div>
      </div>
      <div class="two">
        <div class="field"><label for="up-subject">المادة</label><select id="up-subject" name="subject" data-change="upsubject">${ss.map(s => `<option value="${s.id}" ${s.id === a.subject ? "selected" : ""}>${esc(s.name)}</option>`).join("")}</select></div>
        <div class="field"><label for="up-trim">الثلاثي</label><select id="up-trim" name="trim">${[1,2,3].map(t => `<option value="${t}" ${t === (a.trim || currentTrim()) ? "selected" : ""}>${TRIM[t]}</option>`).join("")}<option value="0" ${a.trim === 0 ? "selected" : ""}>طوال السنة (لكلّ مشترك في المجال)</option></select></div>
      </div>
      <div class="field"><label for="up-kind">النوع</label><select id="up-kind" name="kind">${KINDS.map(k => `<option value="${k.id}">${k.label}</option>`).join("")}</select></div>
      <div class="field"><label for="up-title">العنوان</label><input id="up-title" name="title" required placeholder="مثال: قراءة – الوحدة 2"></div>
      <div class="field"><label for="up-file">الملف</label><input id="up-file" name="file" type="file" accept=".doc,.docx,.ppt,.pptx,.pdf,.xls,.xlsx,.zip" required><span class="hint">Word أو PowerPoint أو PDF، إلى حدود 50 ميغا.</span></div>
      <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="is_free" id="up-free"> ملف مجاني (يحمّله كلّ من لديه حساب، كعيّنة)</label>
      <button class="btn primary" type="submit">${icon("down")}رفع الملف</button>
    </form>
  </div>
  <div><div class="sec-head"><h2 style="font-size:19px">ملفّات ${esc(subjName)} · ${GRADE[a.grade]}</h2></div>
  <div class="list">${existing || `<div class="empty">أضف مجالًا ومادة أولًا من تبويب «المجالات».</div>`}</div></div>`;
}
function admDomains(){
  const g = S.adm.domGrade;
  const ds = domainsOf(g);
  const cards = ds.map(d => {
    const ss = subjectsOf(d.id);
    return `<div class="card dom-card">
      <div class="hd"><h3>${esc(d.name)}</h3><button class="btn danger sm" data-act="deldom" data-id="${d.id}" data-confirm="${(S.counts[d.id] || 0) ? "ستُحذف كلّ موادّه وملفّاته. تأكيد؟" : "تأكيد حذف المجال؟"}">حذف المجال</button></div>
      <div class="list">${ss.map(s => `<div class="row"><div class="main"><div class="ttl">${esc(s.name)}</div></div>
        <button class="btn ghost sm" data-act="delsubj" data-id="${s.id}" data-confirm="تحذف المادة وملفّاتها؟">حذف</button></div>`).join("") || `<div class="empty">لا توجد موادّ.</div>`}</div>
      <form class="f inline-f" data-form="addsubj" data-d="${d.id}" novalidate>
        <div class="field"><label for="sj-${d.id}" class="small">مادة جديدة في ${esc(d.name)}</label><input id="sj-${d.id}" name="name" required placeholder="مثال: الخطّ"></div>
        <button class="btn soft" type="submit">إضافة</button>
      </form>
    </div>`;
  }).join("");
  return `<div class="field" style="max-width:320px"><label for="dm-grade">القسم</label><select id="dm-grade" data-change="domgrade">${[1,2,3,4,5,6].map(x => `<option value="${x}" ${x === g ? "selected" : ""}>${GRADE[x]}</option>`).join("")}</select></div>
    ${cards || `<div class="list"><div class="empty">لا توجد مجالات في هذا القسم.</div></div>`}
    <div class="card">
      <form class="f inline-f" data-form="adddom" novalidate>
        <div class="field"><label for="dm-name">مجال جديد في ${GRADE[g]}</label><input id="dm-name" name="name" required placeholder="مثال: الإنجليزية"></div>
        <button class="btn primary" type="submit">إضافة المجال</button>
      </form>
    </div>`;
}

const VIEWS = { home: vHome, grade: vGrade, domain: vDomain, login: vLogin, register: vRegister, forgot: vForgot, account: vAccount, subscribe: vSubscribe, admin: vAdmin };
const NEEDS_LOGIN = ["account", "subscribe", "admin"];

let seqR = 0;
async function render(scrollTop){
  const n = ++seqR;
  $("#hdr").innerHTML = header();
  $("#ftr").innerHTML = footer();
  $("#demo").innerHTML = api.demo ? `<div class="demo"><div class="wrap"><b>نسخة تجريبية:</b> المحتوى أمثلة فقط، ولا يُحفظ شيء. جرّب الدخول كمعلّم أو كمدير.</div></div>` : "";
  let route = S.route;
  if (S.recovery) route = "recovery";
  else if (NEEDS_LOGIN.includes(route) && !S.session){ S.afterLogin = route; route = "login"; }
  const view = route === "recovery" ? vRecovery : (VIEWS[route] || vHome);
  const main = $("#main");
  let out;
  try { out = view(S.param); } catch (e) { out = errBox(e); }
  if (out && typeof out.then === "function"){
    if (!main.firstElementChild || scrollTop) main.innerHTML = `<div class="loading">جارٍ التحميل…</div>`;
    try { out = await out; } catch (e) { out = errBox(e); }
    if (n !== seqR) return;
  }
  main.innerHTML = out;
  if (route === "home" && (S.param === "grades" || S.param === "pricing")){
    const el = document.getElementById("sec-" + S.param); if (el) el.scrollIntoView({ block: "start" });
  } else if (scrollTop) window.scrollTo(0, 0);
}
const errBox = e => `<div class="wrap"><div class="notice warn" style="margin-top:24px">${esc(arError(e))}</div></div>`;

/* ============================================================
   الأحداث
   ============================================================ */
let toastT;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 3800); }
async function busy(btn, fn){ const old = btn.innerHTML; btn.disabled = true; try { return await fn(); } finally { if (btn.isConnected){ btn.disabled = false; btn.innerHTML = old; } } }
function formErr(f, msg){ const e = f.querySelector(".err"); if (e){ e.textContent = msg || ""; e.classList.toggle("on", !!msg); } }
const resIn = (key, id) => (S.res[key] || []).find(r => r.id === id);
function afterLoginGo(){ const t = S.afterLogin || (isAdmin() ? "admin" : "account"); S.afterLogin = null; go(t); }
function preFrom(b){
  const g = +b.dataset.g || S.lastGrade || 1;
  S.pre = { grade: g, domains: b.dataset.d ? [+b.dataset.d] : [], trims: [b.dataset.t ? +b.dataset.t : currentTrim()] };
}
async function adminDo(b, fn, msg){ await busy(b, async () => { try { await fn(); toast(msg); render(); } catch (e) { toast(arError(e)); } }); }

const ACTS = {
  trim(b){ S.trimTab = +b.dataset.t; S.kindTab = "all"; render(); },
  kind(b){ S.kindTab = b.dataset.k; render(); },
  presub(b){ preFrom(b); },
  remember(){ S.afterLogin = location.hash.slice(1); },
  locked(b){
    if (!S.session){ S.afterLogin = location.hash.slice(1); go("login"); }
    else { preFrom(b); go("subscribe"); }
  },
  async download(b){
    const r = resIn(b.dataset.k, +b.dataset.id); if (!r) return;
    await busy(b, async () => {
      try {
        const url = await api.downloadUrl(r);
        if (!url){ toast("نسخة تجريبية: في الموقع الحقيقي يبدأ تحميل الملف هنا."); return; }
        const a = document.createElement("a"); a.href = url; a.target = "_blank"; a.rel = "noopener";
        document.body.appendChild(a); a.click(); a.remove();
      } catch (e) { toast(arError(e)); }
    });
  },
  async demoas(b){ await busy(b, async () => { S.session = await api.demoAs(b.dataset.who); await loadUser(); afterLoginGo(); }); },
  async logout(){ await api.signOut(); S.session = null; S.profile = null; S.subs = []; S.admSubs = null; go("home"); toast("تمّ تسجيل الخروج."); },
  copy(b){
    const v = b.dataset.v;
    const fallback = () => { const el = $("#payval"); if (el){ const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } toast("اضغط مطوّلًا على الرقم لنسخه."); };
    try { navigator.clipboard.writeText(v).then(() => toast("تمّ النسخ."), fallback); } catch (e) { fallback(); }
  },
  atab(b){ S.adm.tab = b.dataset.t; render(); },
  async approve(b){
    const id = +b.dataset.id; const exp = (document.getElementById("exp-" + id) || {}).value || defaultExpiry();
    await adminDo(b, async () => { await api.setSub(id, { status: "active", expires_at: exp }); S.admSubs = null; }, "تمّ تفعيل الاشتراك.");
  },
  async reject(b){ await adminDo(b, async () => { await api.setSub(+b.dataset.id, { status: "rejected" }); S.admSubs = null; }, "تمّ رفض الطلب."); },
  async deactivate(b){ await adminDo(b, async () => { await api.setSub(+b.dataset.id, { status: "rejected" }); S.admSubs = null; }, "تمّ إيقاف الاشتراك."); },
  async reactivate(b){ await adminDo(b, async () => { await api.setSub(+b.dataset.id, { status: "active", expires_at: defaultExpiry() }); S.admSubs = null; }, "تمّ التفعيل."); },
  async delres(b){
    const r = resIn(b.dataset.k, +b.dataset.id); if (!r) return;
    await adminDo(b, async () => { await api.deleteResource(r); await loadCatalog(); }, "تمّ حذف الملف.");
  },
  async delsubj(b){ await adminDo(b, async () => { await api.deleteSubject(+b.dataset.id); await loadCatalog(); }, "تمّ حذف المادة."); },
  async deldom(b){ await adminDo(b, async () => { await api.deleteDomain(+b.dataset.id); await loadCatalog(); }, "تمّ حذف المجال."); }
};

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  if (b.dataset.confirm && b.dataset.armed !== "1"){
    e.preventDefault(); b.dataset.armed = "1"; const old = b.textContent; b.textContent = b.dataset.confirm;
    setTimeout(() => { if (b.isConnected && b.dataset.armed === "1"){ b.dataset.armed = ""; b.textContent = old; } }, 4000);
    return;
  }
  const fn = ACTS[b.dataset.act]; if (fn) fn(b, e);
});

document.addEventListener("change", e => {
  const t = e.target, k = t.dataset && t.dataset.change; if (!k) return;
  if (k === "sgrade"){ const g = +t.value; S.pre = { ...(S.pre || {}), grade: g, domains: [], trims: (S.pre && S.pre.trims) || [currentTrim()] }; $("#sb-domains").innerHTML = domainChecks(g, []); updateTotal(); }
  if (k === "pick") updateTotal();
  if (k === "upgrade"){ S.adm.grade = +t.value; S.adm.domain = null; S.adm.subject = null; render(); }
  if (k === "updomain"){ S.adm.domain = +t.value; S.adm.subject = null; render(); }
  if (k === "upsubject"){ S.adm.subject = +t.value; render(); }
  if (k === "domgrade"){ S.adm.domGrade = +t.value; render(); }
});

const emailOk = v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
const FORMS = {
  async login(f, d){
    if (!emailOk(d.email)) return formErr(f, "اكتب بريدًا إلكترونيًا صحيحًا.");
    if (!d.password) return formErr(f, "اكتب كلمة السرّ.");
    S.session = await api.signIn(d.email.trim(), d.password); await loadUser(); afterLoginGo();
  },
  async register(f, d){
    if (!d.full_name.trim()) return formErr(f, "اكتب اسمك ولقبك.");
    if (!emailOk(d.email)) return formErr(f, "اكتب بريدًا إلكترونيًا صحيحًا.");
    if (d.password.length < 6) return formErr(f, "كلمة السرّ يجب أن تكون 6 أحرف على الأقل.");
    if (d.password !== d.password2) return formErr(f, "كلمتا السرّ غير متطابقتين.");
    const r = await api.signUp({ email: d.email.trim(), password: d.password, full_name: d.full_name.trim(), phone: d.phone.trim() });
    if (r && r.session){ S.session = r.session; await loadUser(); toast("مرحبًا بك! تمّ إنشاء حسابك."); afterLoginGo(); }
    else f.closest(".card").innerHTML = `<h1>تحقّق من بريدك</h1><p>أرسلنا رسالة إلى <b style="direction:ltr;unicode-bidi:isolate">${esc(d.email)}</b>. اضغط على الرابط داخلها لتفعيل حسابك، ثم سجّل الدخول. إذا لم تجدها، تفقّد البريد غير المرغوب فيه (Spam).</p><a class="btn primary" href="#login">تسجيل الدخول</a>`;
  },
  async forgot(f, d){
    if (!emailOk(d.email)) return formErr(f, "اكتب بريدًا إلكترونيًا صحيحًا.");
    await api.resetPassword(d.email.trim());
    f.closest(".card").innerHTML = `<h1>تحقّق من بريدك</h1><p>إذا كان البريد مسجّلًا، ستصلك رسالة فيها رابط لتعيين كلمة سرّ جديدة. تفقّد أيضًا البريد غير المرغوب فيه (Spam).</p><a class="btn ghost" href="#login">رجوع</a>`;
  },
  async newpw(f, d){
    if (d.password.length < 6) return formErr(f, "كلمة السرّ يجب أن تكون 6 أحرف على الأقل.");
    await api.updatePassword(d.password); S.recovery = false; toast("تمّ حفظ كلمة السرّ الجديدة."); go("account");
  },
  async subscribe(f, d, fd){
    const domain_ids = fd.getAll("domain").map(Number);
    const trimesters = fd.getAll("trim").map(Number);
    if (!domain_ids.length) return formErr(f, "اختر مجالًا واحدًا على الأقل.");
    if (!trimesters.length) return formErr(f, "اختر ثلاثيًا واحدًا على الأقل.");
    if (!d.ref.trim()) return formErr(f, "اكتب رقم العملية حتى نتثبّت من الدفع.");
    await api.requestSub({ grade: +d.grade, domain_ids, trimesters, payment_method: "D17", payment_ref: d.ref.trim(), amount: domain_ids.length * trimesters.length * C.PRICE });
    S.subs = await api.mySubs(S.session.user.id); S.admSubs = null; S.pre = null;
    toast("وصلنا طلبك. سنفعّل اشتراكك " + C.ACTIVATION_DELAY + "."); go("account");
  },
  async upload(f, d){
    const file = f.querySelector("#up-file").files[0];
    if (!d.subject) return formErr(f, "اختر المادة. إذا لم توجد، أضفها من تبويب «المجالات».");
    if (!d.title.trim()) return formErr(f, "اكتب عنوان الملف.");
    if (!file) return formErr(f, "اختر الملف الذي تريد رفعه.");
    if (file.size > 50 * 1024 * 1024) return formErr(f, "الملف أكبر من 50 ميغا. صغّره أو قسّمه.");
    const t = +d.trim; S.adm.trim = t;
    await api.upload({ grade: +d.grade, subject_id: +d.subject, kind: d.kind, trimester: t === 0 ? null : t, title: d.title.trim(), file, is_free: !!f.querySelector("#up-free").checked });
    await loadCatalog(); toast("تمّ رفع الملف."); render();
  },
  async adddom(f, d){
    if (!d.name.trim()) return formErr(f, "اكتب اسم المجال.");
    const g = S.adm.domGrade; const max = Math.max(0, ...domainsOf(g).map(x => x.sort || 0));
    await api.addDomain({ grade: g, name: d.name.trim(), sort: max + 1 }); await loadCatalog(); toast("تمّت إضافة المجال."); render();
  },
  async addsubj(f, d){
    if (!d.name.trim()) return formErr(f, "اكتب اسم المادة.");
    const did = +f.dataset.d; const max = Math.max(0, ...subjectsOf(did).map(x => x.sort || 0));
    await api.addSubject({ domain_id: did, name: d.name.trim(), sort: max + 1 }); await loadCatalog(); toast("تمّت إضافة المادة."); render();
  }
};
document.addEventListener("submit", async e => {
  const f = e.target; const k = f.dataset && f.dataset.form; if (!k) return;
  e.preventDefault(); formErr(f, "");
  const fd = new FormData(f);
  const d = Object.fromEntries(fd.entries());
  ["email","password","password2","full_name","phone","ref","title","name"].forEach(x => { if (d[x] == null) d[x] = ""; });
  const btn = f.querySelector('[type="submit"]');
  await busy(btn, async () => { try { await FORMS[k](f, d, fd); } catch (err) { formErr(f, arError(err)); } });
});

/* ============================================================
   البداية
   ============================================================ */
(async function start(){
  Object.assign(S, parseHash());
  $("#main").innerHTML = `<div class="loading">جارٍ التحميل…</div>`;
  $("#hdr").innerHTML = header();
  try {
    S.session = await api.session();
    await Promise.all([loadCatalog(), loadUser()]);
  } catch (e) { $("#main").innerHTML = errBox(e); return; }
  api.onAuth(async (ev, session) => {
    if (ev === "PASSWORD_RECOVERY") S.recovery = true;
    const changed = (session && session.user.id) !== (S.session && S.session.user.id);
    S.session = session;
    if (changed || ev === "PASSWORD_RECOVERY"){ S.admSubs = null; await loadUser().catch(() => {}); render(); }
  });
  render();
})();
})();
</script>
